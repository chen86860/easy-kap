name: Release

# Pushing a tag such as v0.1.2 builds the disk image, signs it for Sparkle, and publishes a GitHub release with
# EasyKap.dmg and appcast.xml. The release notes come from that version's section in CHANGELOG.md, which must exist.
# Running the workflow by hand only builds the disk image and attaches it to the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the app, such as 0.1.1. Leave empty to keep the version in project.yml.
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build EasyKap.dmg
    runs-on: macos-26
    env:
      # Developer ID signing and notarization run only when the certificate secret exists; otherwise the build
      # stays ad-hoc signed. Secrets can't appear in `if:` conditions, so this flag carries the check.
      SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the changelog entry
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen and create-dmg
        run: brew install xcodegen create-dmg

      - name: Import the Developer ID certificate
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          # The runner's /bin/bash is 3.2, which has no mapfile.
          existing=()
          while IFS= read -r line; do existing+=("$(printf '%s' "$line" | sed 's/[ "]//g')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          security find-identity -v -p codesigning "$keychain"

      - name: Build disk image
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: Tools/make-dmg.sh "${VERSION#v}"

      - name: Notarize disk image
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: Tools/notarize-dmg.sh build/EasyKap.dmg

      - name: Attach disk image to the run
        uses: actions/upload-artifact@v4
        with:
          name: EasyKap.dmg
          path: build/EasyKap.dmg
          if-no-files-found: error

      # After notarization: stapling rewrites the DMG, so Sparkle's signature must cover the final file.
      - name: Sign for Sparkle and write the appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: Tools/make-appcast.sh "${GITHUB_REF_NAME#v}"

      # The website links to releases/latest/download/EasyKap.dmg and the app reads
      # releases/latest/download/appcast.xml, so both asset names must stay fixed.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/EasyKap.dmg build/appcast.xml
          --title "Easy Kap ${GITHUB_REF_NAME#v}" --notes-file build/release-notes.md --verify-tag
