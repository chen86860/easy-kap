name: Release

# Pushing a tag such as v0.1.2 builds the disk image, signs it for Sparkle, and publishes a GitHub release with
# EasyKap.dmg and appcast.xml. The release notes come from that version's section in CHANGELOG.md, which must exist.
# Running the workflow by hand only builds the disk image and attaches it to the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the app, such as 0.1.1. Leave empty to keep the version in project.yml.
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build EasyKap.dmg
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Check the changelog entry
        if: github.ref_type == 'tag'
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; }

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen and create-dmg
        run: brew install xcodegen create-dmg

      - name: Build disk image
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: Tools/make-dmg.sh "${VERSION#v}"

      - name: Attach disk image to the run
        uses: actions/upload-artifact@v4
        with:
          name: EasyKap.dmg
          path: build/EasyKap.dmg
          if-no-files-found: error

      - name: Sign for Sparkle and write the appcast
        if: github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: Tools/make-appcast.sh "${GITHUB_REF_NAME#v}"

      # The website links to releases/latest/download/EasyKap.dmg and the app reads
      # releases/latest/download/appcast.xml, so both asset names must stay fixed.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/EasyKap.dmg build/appcast.xml
          --title "Easy Kap ${GITHUB_REF_NAME#v}" --notes-file build/release-notes.md --verify-tag
